<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>바로서기 홈트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: one-column app (max 760px) with a sticky header and a fixed bottom tab bar; large type for older adults */
:root{
  --bg:#EEF3EF; --surface:#FFFFFF; --surface-2:#E2EAE4; --ink:#14231C; --ink-2:#4C5D55; --line:#C6D2CA;
  --primary:#1B6A55; --primary-ink:#FFFFFF; --primary-soft:#D3E8DF;
  --gold:#A87508; --gold-soft:#F6E8C6; --warn:#B23B32; --warn-soft:#F7DEDA;
  --ankle:#2B67A0; --ankle-soft:#DCE8F4; --hip:#83489A; --hip-soft:#EEE0F3; --step:#B8621E; --step-soft:#F7E4D3;
  --fig:#14231C; --fig-far:#8A9A92;
  --skin:#E9B58C; --hair:#3A2C24; --eye:#2A2522; --shirt:#E0703A; --pants:#2F4D74; --shoe:#2B2B2B; --floor:#D8E1DA; --prop:#8C7A62; --prop-soft:#C9B9A1;
  --f-display:"Do Hyeon","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:14px;
  --pic-tool:#E2F0E8; --pic-food:#FBF0DA; --pic-coffee:#F4E9DE;
  /* 시범 인물(참고 캐릭터 색) — 두 테마에서 같은 색 */
  --c-skin:#FFD9CE; --c-skin2:#F4C3B3; --c-hair:#D5D6DA; --c-line:#F0AE9F; --c-eye:#3A3A3E; --c-cheek:#FFC4B6;
  --c-cardi:#38617F; --c-cardi2:#2F5576; --c-cuff:#284963; --c-shirt:#F2F2F2; --c-button:#E6DDCB; --c-belt:#5E4A3B;
  --c-pants:#A8987C; --c-pants2:#8C7F6B; --c-shoe:#5D4637; --c-shoe2:#4A382D; --c-sole:#3B2A22; --c-shadow:rgba(40,60,50,.16);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1814; --surface:#17221D; --surface-2:#213029; --ink:#E6EFEA; --ink-2:#A6B8AF; --line:#33463D;
  --primary:#5CBE9C; --primary-ink:#0B1A14; --primary-soft:#1D3A30;
  --gold:#E4B848; --gold-soft:#3A3020; --warn:#EA7D70; --warn-soft:#40231F;
  --ankle:#78B0E4; --ankle-soft:#1C2D3D; --hip:#C792DB; --hip-soft:#33233B; --step:#E99A5C; --step-soft:#3B2A1C;
  --fig:#E6EFEA; --fig-far:#71857B; --pic-tool:#26382F; --pic-food:#3A3122; --pic-coffee:#3A2E25;
  --skin:#E3AE86; --hair:#5A463A; --eye:#2A2522; --shirt:#F08A55; --pants:#7FA2C8; --shoe:#C9BFB2; --floor:#1A2722; --prop:#B59F80; --prop-soft:#5E5242; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1814; --surface:#17221D; --surface-2:#213029; --ink:#E6EFEA; --ink-2:#A6B8AF; --line:#33463D;
  --primary:#5CBE9C; --primary-ink:#0B1A14; --primary-soft:#1D3A30;
  --gold:#E4B848; --gold-soft:#3A3020; --warn:#EA7D70; --warn-soft:#40231F;
  --ankle:#78B0E4; --ankle-soft:#1C2D3D; --hip:#C792DB; --hip-soft:#33233B; --step:#E99A5C; --step-soft:#3B2A1C;
  --fig:#E6EFEA; --fig-far:#71857B; --pic-tool:#26382F; --pic-food:#3A3122; --pic-coffee:#3A2E25;
  --skin:#E3AE86; --hair:#5A463A; --eye:#2A2522; --shirt:#F08A55; --pants:#7FA2C8; --shoe:#C9BFB2; --floor:#1A2722; --prop:#B59F80; --prop-soft:#5E5242; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.25;text-wrap:balance;margin:0}
h1{font-size:2rem} h2{font-size:1.6rem} h3{font-size:1.3rem}
p{margin:0}
button{font:inherit;color:inherit}
a{color:var(--primary)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:1.45rem;text-decoration:none;color:var(--ink)}
.brand svg{flex:none}
.pts{margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--gold-soft);color:var(--ink);border:1px solid var(--gold);border-radius:999px;padding:4px 14px;font-weight:800;font-variant-numeric:tabular-nums;text-decoration:none}
.pts .coin{width:20px;height:20px;border-radius:50%;background:var(--gold);color:var(--surface);font-size:.7rem;display:grid;place-items:center;font-weight:800}

main{max-width:760px;margin:0 auto;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 10px;text-decoration:none;color:var(--ink-2);font-size:.9rem;font-weight:700;min-height:64px}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--primary)}
.tab[aria-current="page"] svg{stroke:var(--primary)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.muted{color:var(--ink-2)}
.small{font-size:.92rem}
.eyebrow{font-size:.85rem;font-weight:800;letter-spacing:.06em;color:var(--ink-2)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:10px 22px;border-radius:12px;border:2px solid var(--primary);background:var(--primary);color:var(--primary-ink);font-weight:800;font-size:1.08rem;cursor:pointer;text-decoration:none;text-align:center}
.btn.ghost{background:transparent;color:var(--primary)}
.btn.soft{background:var(--primary-soft);border-color:var(--primary-soft);color:var(--ink)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--surface)}
.btn.warn{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}

.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px;font-size:.9rem;font-weight:800;border:1.5px solid currentColor}
.chip.ankle{color:var(--ankle);background:var(--ankle-soft)}
.chip.hip{color:var(--hip);background:var(--hip-soft)}
.chip.step{color:var(--step);background:var(--step-soft)}
.chip.warm,.chip.cool{color:var(--ink-2);background:var(--surface-2)}
.chip.lv{color:var(--primary);background:var(--primary-soft)}

.notice{border-left:5px solid var(--warn);background:var(--warn-soft);border-radius:10px;padding:14px 16px;font-size:.98rem}
.notice.info{border-left-color:var(--primary);background:var(--primary-soft)}

/* Shorts player */
.shorts-wrap{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:640px){.shorts-wrap{grid-template-columns:1fr}}
.short{position:relative;width:100%;max-width:340px;aspect-ratio:9/16;border-radius:20px;overflow:hidden;background:#0E1A15;color:#F2F7F4;justify-self:center;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.short .bars{display:flex;gap:4px;padding:12px 12px 0}
.short .bar{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.28);overflow:hidden}
.short .bar i{display:block;height:100%;width:0;background:#fff}
.short .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px 18px;text-align:center;min-height:0}
.short .cap{font-family:var(--f-display);font-size:1.45rem;line-height:1.3;padding:0 18px 10px;text-align:center;min-height:5.2em;display:flex;align-items:center;justify-content:center}
.short .ctrl{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 14px;gap:6px}
.short .ctrl button{white-space:nowrap;background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:999px;min-width:48px;height:48px;padding:0 14px;font-weight:800;cursor:pointer;font-size:.95rem}
.short .ctrl button.main{background:#fff;color:#0E1A15;min-width:96px}
.short .big{font-family:var(--f-display);font-size:4.2rem;line-height:1;color:#F7D57A}
.short .mid{font-size:1.05rem;color:#CFE2D9}
.short .tag{display:inline-block;background:#F7D57A;color:#0E1A15;border-radius:6px;padding:2px 10px;font-weight:800;font-size:.9rem}
.short svg{max-width:100%}
.short .scene-title{font-size:.85rem;letter-spacing:.08em;color:#9FC4B4;font-weight:800}
.short .fig-dark{--fig:#F2F7F4;--fig-far:#7E968A;--shirt:#F08A55;--pants:#7FA2C8;--shoe:#C9BFB2;--hair:#5A463A;--floor:#1A2722;--prop:#B59F80;--prop-soft:#5E5242;--line:#4C6559;--primary:#6FD3AE;--warn:#FF8C7A;--gold-soft:#4A3F22;--surface-2:#22352C;--ink-2:#9FB7AB}
.shorts-tabs{display:flex;gap:8px;flex-wrap:wrap}
.seg{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:800;cursor:pointer;min-height:48px}
.seg[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}

/* Figure */
.figbox{background:var(--surface-2);border-radius:var(--r);position:relative;overflow:hidden}
.figbox svg{display:block;width:100%;height:auto}
.figlegend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--ink-2);padding:0 4px}
.figlegend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}

/* Week tracker */
.week{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.wk{border:2px dashed var(--line);border-radius:12px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center;min-width:0}
.wk b{font-family:var(--f-display);font-weight:400;font-size:1.2rem}
.wk.done{border-style:solid}
.wk.ankle.done{border-color:var(--ankle);background:var(--ankle-soft)}
.wk.hip.done{border-color:var(--hip);background:var(--hip-soft)}
.wk.step.done{border-color:var(--step);background:var(--step-soft)}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:800}
.wk.done .check{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.meter{height:14px;border-radius:7px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--gold);border-radius:7px}

/* Survey */
.q-num{font-weight:800;color:var(--primary);font-variant-numeric:tabular-nums}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;min-height:64px;padding:12px 16px;border:2px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;font-size:1.08rem;font-weight:500}
.opt .sc{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--surface-2);font-variant-numeric:tabular-nums}
.opt[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.opt[aria-pressed="true"] .sc{background:var(--primary);color:var(--primary-ink)}
.progress{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--primary)}

/* Result */
.level-badge{display:flex;align-items:center;gap:16px}
.level-badge .lvl{font-family:var(--f-display);font-size:3rem;line-height:1;color:var(--primary);white-space:nowrap;flex:none}
.dom{display:grid;grid-template-columns:8.5em 1fr 3.2em;gap:10px;align-items:center;font-size:.98rem}
.dom .meter i{background:var(--primary)}
.dom span:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}

/* Program */
.lv-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lv-pick button{min-height:60px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.lv-pick button small{font-weight:500;font-size:.78rem;color:var(--ink-2)}
.lv-pick button[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.day{border-radius:var(--r);border:2px solid var(--line);background:var(--surface);overflow:hidden;display:flex;flex-direction:column}
.day-head{padding:16px 18px;display:flex;gap:14px;align-items:center}
.day-head .dot{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-size:1.3rem;color:var(--surface);flex:none}
.day.ankle .dot{background:var(--ankle)} .day.hip .dot{background:var(--hip)} .day.step .dot{background:var(--step)}
.day.ankle{border-color:var(--ankle)} .day.hip{border-color:var(--hip)} .day.step{border-color:var(--step)}
.ex-list{list-style:none;margin:0;padding:0 18px 6px;display:flex;flex-direction:column}
.ex-list li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:1rem}
.ex-list li span:last-child{color:var(--ink-2);text-align:right;font-size:.92rem}
.day-foot{padding:12px 18px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
table.wide{min-width:520px}
th,td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top}
th{font-size:.85rem;color:var(--ink-2);font-weight:800;letter-spacing:.03em}

/* Session */
.sess-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.steps-dots{display:flex;gap:5px;flex-wrap:wrap}
.steps-dots i{width:22px;height:8px;border-radius:4px;background:var(--surface-2)}
.steps-dots i.on{background:var(--primary)}
.steps-dots i.done{background:var(--primary-soft)}
.ex-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:640px){.ex-grid{grid-template-columns:1fr}}
.dose{background:var(--primary-soft);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.dose b{font-family:var(--f-display);font-weight:400;font-size:1.5rem;line-height:1.2}
ol.how{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px}
.sets{display:flex;gap:10px;flex-wrap:wrap}
.setbtn{width:64px;height:64px;border-radius:50%;border:3px solid var(--primary);background:var(--surface);font-weight:800;font-size:1rem;cursor:pointer;color:var(--primary)}
.setbtn[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.timer{font-family:var(--f-display);font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.nav-row{display:grid;grid-template-columns:1fr 2fr;gap:10px}

/* Store */
.store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.item .pic{height:150px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;padding:8px}
.item .pic{position:relative}
.new-badge{position:absolute;top:8px;left:8px;background:var(--warn);color:var(--surface);font-size:.72rem;font-weight:800;letter-spacing:.06em;border-radius:6px;padding:2px 7px}
.item-tags{display:flex;gap:6px}
.item .weeks{font-size:.82rem;font-weight:700;color:var(--ink-2);margin-left:4px}
.item .tag{font-size:.78rem;font-weight:800;border-radius:999px;padding:1px 10px;background:var(--surface-2);color:var(--ink-2)}
.item .tag.tool{background:var(--primary-soft);color:var(--primary)}
.item .tag.food{background:var(--gold-soft);color:var(--gold)}
.item .tag.sup{background:var(--hip-soft);color:var(--hip)}
.item .tag.coffee{background:var(--step-soft);color:var(--step)}
.item .pic.tool{background:var(--pic-tool)}.item .pic.food{background:var(--pic-food)}.item .pic.coffee{background:var(--pic-coffee)}
.item .price{font-weight:800;font-variant-numeric:tabular-nums;color:var(--gold)}
.coupon{border:2px dashed var(--gold);border-radius:12px;padding:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--gold-soft)}
.coupon code{font-size:1.1rem;font-weight:800;letter-spacing:.05em}

/* My */
.ledger{list-style:none;margin:0;padding:0}
.ledger li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.98rem}
.ledger .plus{color:var(--primary);font-weight:800;font-variant-numeric:tabular-nums}
.ledger .minus{color:var(--warn);font-weight:800;font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-weight:400;font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}

/* Modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,20,15,.55);display:grid;place-items:center;padding:16px}
.modal-box{background:var(--surface);border-radius:18px;max-width:440px;width:100%;padding:24px;display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto}
.burst{font-family:var(--f-display);font-size:3.2rem;color:var(--gold);line-height:1}

.hero{display:flex;flex-direction:column;gap:10px}
.hero p{max-width:34em}
.foot-note{font-size:.88rem;color:var(--ink-2)}
.ref{font-size:.9rem;display:flex;flex-direction:column;gap:8px;padding-left:1.2em;margin:0}


/* Follow-along player */
body.focus .tabs{display:none}
body.focus main{padding-bottom:32px}
.player{display:flex;flex-direction:column;gap:14px}
.pl-top{display:flex;align-items:center;gap:10px}
.pl-title{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.pl-mini{min-height:44px;padding:6px 14px;font-size:.95rem}
.pl-main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:680px){.pl-main{grid-template-columns:1fr}}
.pl-stage{position:relative}
.pl-fig{background:var(--surface-2)}
.pl-over{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--surface) 55%,transparent);border-radius:var(--r)}
.pl-over b{font-family:var(--f-display);font-weight:400;font-size:7rem;line-height:1;color:var(--primary)}
.pl-paused{font-family:var(--f-display);font-size:2.6rem;color:var(--ink)}
.pl-side{position:absolute;top:10px;left:10px;background:var(--hip);color:var(--surface);font-weight:800;border-radius:999px;padding:2px 12px;font-size:.95rem}
.pl-panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.pl-name{font-size:2rem}
.pl-name.sm{font-family:var(--f-display);font-size:1.35rem}
.pl-setup{font-size:1.2rem;font-weight:500}
.pl-dose{background:var(--primary-soft);border-radius:12px;padding:12px 16px;font-family:var(--f-display);font-size:1.6rem;line-height:1.25;display:flex;flex-direction:column}
.pl-dose span{font-family:var(--f-body);font-size:1rem}
.pl-go{font-size:1.25rem;min-height:64px}
.pl-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.pl-set{font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pl-count{display:flex;align-items:baseline;gap:8px}

.pl-bar{height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden}

.pl-rest{display:flex;align-items:baseline;gap:6px}

.pl-ctrl{display:grid;grid-template-columns:1fr 2fr 1fr;gap:10px}
.pl-pause{font-size:1.25rem;min-height:64px}

.ex-txt{display:flex;flex-direction:column;min-width:0;line-height:1.35}

.pl-cam{position:absolute;right:8px;bottom:30px;width:38%;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#101814;border:3px solid var(--surface);box-shadow:0 6px 18px rgba(0,0,0,.25)}

.pl-proof{text-align:center;color:var(--ink-2)}

/* Animated shorts */
.short{--ink-2:#CFE2D9}
.short .stage.anim{padding:0;position:relative;display:block;overflow:hidden}
.sc{position:absolute;inset:0;overflow:hidden;background:#F1E1CA}
.sc-dark{background:radial-gradient(120% 90% at 50% 30%,#1C2E27 0%,#0B1310 70%)}
.sc-xray{background:#050B12}
.sc-cam{position:absolute;inset:0;transform-origin:50% 75%}
.sc-cam.kb{animation:kb 9s linear forwards}
.sc-cam.slowzoom{animation:slowzoom 1.6s cubic-bezier(.3,.6,.3,1) forwards}
.sc-cam.shake{animation:slowzoomEnd .01s forwards,shake .55s .01s}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
@keyframes slowzoom{from{transform:scale(1.03)}to{transform:scale(1.32) translateY(-3%)}}
@keyframes slowzoomEnd{to{transform:scale(1.32) translateY(-3%)}}
@keyframes shake{0%,100%{translate:0 0}15%{translate:-9px 5px}30%{translate:8px -6px}45%{translate:-6px 3px}60%{translate:5px -3px}80%{translate:-2px 1px}}
.sc-fig{position:absolute;inset:0}
.sc-fig svg{width:100%;height:100%;display:block}
.sc-vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 55%,rgba(0,0,0,.35))}
.sc-vig.strong{background:radial-gradient(ellipse at 50% 60%,transparent 35%,rgba(0,0,0,.6))}
.gray{filter:grayscale(.9) brightness(.72) contrast(1.05)}
.sc-flash{position:absolute;inset:0;background:#E5332A;opacity:0;pointer-events:none}
.sc-flash.go{animation:flash .9s ease-out}
@keyframes flash{0%{opacity:.8}100%{opacity:0}}
.boom{position:absolute;top:26%;left:0;right:0;text-align:center;font-family:var(--f-display);font-size:4.6rem;color:#fff;text-shadow:0 0 0 #E5332A,4px 4px 0 #E5332A,0 6px 24px rgba(0,0,0,.4);animation:boom .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes boom{from{transform:scale(2.4) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(-4deg);opacity:1}}
.sc-txt{position:absolute;left:0;right:0;top:7%;padding:0 18px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;z-index:3}
.sc-txt.mid{top:36%}
.sc-txt.low{top:auto;bottom:6%}
.kt{font-family:var(--f-display);font-size:1.85rem;line-height:1.25;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.55),0 0 2px rgba(0,0,0,.6);opacity:0;transform:translateY(16px) scale(.96);animation:kin .7s cubic-bezier(.2,.8,.2,1) forwards}
.sc-txt.mid .kt{font-size:2.3rem}
.kt em{font-style:normal;color:#FFD25A}
.kt em.red{color:#FF6B5E;font-size:2.4rem}
@keyframes kin{to{opacity:1;transform:none}}
.sc-pulse{position:absolute;left:50%;top:44%;width:180px;height:180px;margin:-90px 0 0 -90px;border-radius:50%;background:radial-gradient(circle,rgba(229,51,42,.55),transparent 65%);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.8);opacity:.5}50%{transform:scale(1.15);opacity:1}}
.rug-corner.warn-blink{animation:rugblink .35s ease-in-out 4;transform-box:fill-box;transform-origin:left bottom}
@keyframes rugblink{50%{fill:#FFD25A;transform:scale(1.25)}}
.trio{position:absolute;left:6%;right:6%;top:24%;height:42%;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.trio.shake{animation:shake .45s}
.mini{position:relative;transform-origin:50% 92%;transition:transform .75s cubic-bezier(.55,0,.9,.6)}
.mini svg{width:100%;height:100%}
.mini.topple{transform:rotate(78deg) translateY(4%)}
.sc-stat{position:absolute;left:0;right:0;bottom:7%;display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;font-size:1.15rem;font-weight:700;text-align:center;padding:0 12px}
.sc-stat.two{bottom:2.5%;font-size:1rem}
.sc-stat em{font-style:normal;color:#FFD25A}
.sc-stat .num{font-family:var(--f-display);font-weight:400;font-size:4.4rem;line-height:1;color:#FFD25A}
.sc-stat.hope{bottom:auto;top:30%;background:rgba(14,26,21,.78);margin:0 14%;border-radius:18px;padding:14px 10px}
.sc-stat.hope .num{color:#6FD3AE}
.sc-stat small{font-size:.72rem;color:#9FC4B4;font-weight:500}
.popin{animation:popin .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes popin{from{transform:scale(1.6)}to{transform:scale(1)}}
.scan{position:absolute;left:0;right:0;height:30%;background:linear-gradient(180deg,transparent,rgba(120,200,255,.18),transparent);animation:scan 2.2s linear infinite}
@keyframes scan{from{top:-30%}to{top:100%}}
.xray{position:absolute;left:10%;width:80%;top:6%;height:56%}
.crack{stroke-dasharray:40;stroke-dashoffset:40}
.crack.draw{animation:draw .35s steps(4) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.ring{opacity:0;transform-box:fill-box;transform-origin:center}
.ring.pulse{animation:ring 1.1s ease-out infinite}
@keyframes ring{0%{opacity:1;transform:scale(.6)}100%{opacity:0;transform:scale(1.6)}}
.cycle{position:absolute;left:12%;right:12%;top:7%;aspect-ratio:1}
.cycle svg{width:100%;height:100%}
.cycle .spin{transform-origin:110px 110px;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cyc{position:absolute;transform:translate(-50%,-50%) scale(.6);opacity:0;background:#1E332A;color:#fff;border:1.5px solid #9FC4B4;border-radius:999px;padding:3px 10px;font-weight:800;font-size:.85rem;white-space:nowrap;animation:cyc .5s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes cyc{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.cyc-mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--f-display);font-weight:400;font-size:2.8rem;color:#FFD25A;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.bars4{position:absolute;left:8%;right:8%;top:30%;bottom:16%;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end}
.b4{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;color:#CFE2D9;font-size:.85rem;position:relative}
.b4 i{display:block;width:100%;height:0;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,#6FD3AE,#2E9C86);animation:grow .8s cubic-bezier(.2,.8,.2,1) forwards}
.b4 i.last{background:linear-gradient(180deg,#FF8C7A,#C9483B)}
.b4 b{order:-1;font-family:var(--f-display);font-weight:400;font-size:1.4rem;color:#fff;opacity:0;animation:kin .4s forwards}
@keyframes grow{to{height:calc(var(--h) * .82)}}
.sc-note{position:absolute;left:0;right:0;bottom:5%;text-align:center;font-size:.75rem;color:#9FC4B4}
.rays{position:absolute;left:50%;top:-30%;width:160%;aspect-ratio:1;margin-left:-80%;background:repeating-conic-gradient(rgba(255,230,150,.22) 0 8deg,transparent 8deg 20deg);animation:spin 18s linear infinite;pointer-events:none;mask-image:radial-gradient(circle,#000 20%,transparent 60%);-webkit-mask-image:radial-gradient(circle,#000 20%,transparent 60%)}
.sc-whiteflash{position:absolute;inset:0;background:#fff;opacity:0;animation:wflash 1.2s ease-out}
@keyframes wflash{0%{opacity:.95}100%{opacity:0}}
.lbl{position:absolute;left:8%;background:rgba(14,26,21,.85);color:#fff;font-weight:800;font-size:.9rem;border-radius:10px;padding:6px 12px;opacity:0;transform:translateX(-20px);transition:all .5s cubic-bezier(.2,1.4,.4,1);display:flex;align-items:center;gap:8px}
.lbl i{width:12px;height:12px;border-radius:50%;background:#E5332A}
.lbl.l1{top:22%}.lbl.l2{top:auto;bottom:4%}
.lbl.l2 i{border-radius:3px;background:#2E9C86;width:22px;height:8px}
.lbl.on{opacity:1;transform:none}
.strat3{position:absolute;inset:4% 5%;display:grid;grid-template-rows:repeat(3,1fr);gap:8px}
.st3{display:grid;grid-template-columns:44% 1fr;align-items:center;gap:10px;background:rgba(255,255,255,.06);border:2px solid transparent;border-radius:16px;padding:4px 10px 4px 4px;opacity:.45;transform:scale(.96);transition:all .45s cubic-bezier(.2,1.3,.4,1);min-height:0}
.st3.on{opacity:1;transform:none;border-color:var(--c);background:rgba(255,255,255,.1)}
.st3-fig{height:100%;min-height:0;border-radius:12px;overflow:hidden;background:#22352C}
.st3-fig svg{width:100%;height:100%}
.st3 b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.45rem;color:var(--c)}
.st3 span{color:#CFE2D9;font-size:.9rem}
.confetti i{position:absolute;top:-6%;width:8px;height:14px;border-radius:2px;animation:fall 2.6s linear infinite;opacity:.9}
@keyframes fall{to{transform:translateY(130%) rotate(540deg)}}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{top:-20px}
@keyframes fall{from{transform:translateY(0) rotate(0)}to{transform:translateY(700px) rotate(540deg)}}
.stage.poster .kt,.stage.poster .cyc,.stage.poster .b4 b{opacity:1;transform:none;animation:none}

/* Level tiles & easy balance */
.lv-pick.big button{min-height:76px;font-size:1.35rem;font-family:var(--f-display);font-weight:400}
.lv-pick.big button small{font-family:var(--f-body);font-size:.9rem;font-weight:700}
.lvt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.lvt{display:flex;gap:14px;align-items:flex-start;background:var(--bg);border:1.5px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.lvt-ic{flex:none;width:56px;height:56px;border-radius:14px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center}
.lvt-body{display:flex;flex-direction:column;gap:4px;min-width:0}
.lvt-k{font-size:1rem;font-weight:700;color:var(--ink-2)}
.lvt-v{font-family:var(--f-display);font-weight:400;font-size:1.75rem;line-height:1.2;color:var(--ink)}
.lvt p{font-size:1.02rem;line-height:1.55;color:var(--ink)}
.hands{color:var(--primary)}
.effort{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:4px}
.effort i{height:14px;border-radius:4px;background:var(--surface-2)}
.effort i.on{background:var(--gold)}
.effort-scale{display:flex;justify-content:space-between;font-size:.85rem;color:var(--ink-2)}
.toolchips{display:flex;flex-wrap:wrap;gap:6px}
.toolchips span{background:var(--gold-soft);border:1.5px solid var(--gold);border-radius:999px;padding:3px 12px;font-weight:700;font-size:1rem}
.ladder{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end}
.rung{border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;font-size:1rem;position:relative}
.rung.r1{min-height:150px}.rung.r2{min-height:175px}.rung.r3{min-height:200px}
.rung b{font-family:var(--f-display);font-weight:400;font-size:1.5rem}
.rung.cur{border-color:var(--primary);background:var(--primary-soft)}
.rung em{font-style:normal;font-size:.8rem;font-weight:800;color:var(--primary-ink);background:var(--primary);border-radius:999px;padding:1px 10px;margin-top:4px}
.easy h3{font-size:1.4rem}
.ez-steps{display:flex;flex-direction:column;gap:16px}
.ez{display:flex;gap:14px;align-items:flex-start}
.ez>div:last-child{min-width:0;display:flex;flex-direction:column;gap:6px;flex:1}
.ez-num{flex:none;width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-size:1.5rem}
.ez p{font-size:1.12rem;line-height:1.65}
.ez small{color:var(--ink-2);font-size:.88rem}
.red{color:var(--warn)}.grn{color:var(--primary)}
.rule{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:1.2rem!important}
.feet3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.feet3 figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:.95rem;line-height:1.35}
.fp{width:100%;aspect-ratio:110/86;background:var(--bg);border-radius:12px}
.ways{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.way{display:flex;flex-direction:column;gap:8px;border-radius:16px;padding:10px;border:2px solid var(--line);min-width:0}
.way.ankle{border-color:var(--ankle)}.way.hip{border-color:var(--hip)}.way.step{border-color:var(--step)}
.way-txt{display:flex;flex-direction:column;gap:4px;padding:0 4px 4px}
.way-when{align-self:flex-start;font-size:.9rem;font-weight:800;border-radius:999px;padding:1px 10px;background:var(--surface-2)}
.way.ankle .way-when{background:var(--ankle-soft);color:var(--ankle)}.way.hip .way-when{background:var(--hip-soft);color:var(--hip)}.way.step .way-when{background:var(--step-soft);color:var(--step)}
.way-txt b{font-family:var(--f-display);font-weight:400;font-size:1.5rem}
.way-txt p{font-size:1.05rem;line-height:1.6}
.way-txt small{color:var(--ink-2);font-size:.85rem}
.ez-why{font-size:1.08rem;line-height:1.65}

.pl-vlabel{font-size:.95rem;font-weight:800;color:var(--primary);background:var(--primary-soft);border-radius:999px;padding:2px 12px;align-self:flex-start}
.pl-fb{font-size:1.2rem;font-weight:800;border-radius:12px;padding:10px 14px;line-height:1.4}
.pl-fb.bad{background:var(--warn-soft);color:var(--warn)}
.pl-fb.good{background:var(--primary-soft);color:var(--primary)}
.pl-try{font-size:.95rem;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums}
.cam-tip{display:flex;align-items:center;gap:12px;background:var(--ankle-soft);color:var(--ankle);border-radius:12px;padding:10px 14px;font-size:1.1rem}
.cam-tip span{color:var(--ink)}
.steps-dots i.ok{background:var(--gold)}
.vbtn[aria-pressed="true"]{border-color:var(--warn);background:var(--warn-soft)}

.linkbtn{background:none;border:0;padding:0;color:var(--primary);font-weight:800;text-decoration:underline;cursor:pointer;font-size:inherit}
.help-steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:10px;font-size:1rem;line-height:1.6}
.help-steps code{background:var(--surface-2);border-radius:6px;padding:1px 6px;font-size:.92em;word-break:break-all}

.vh-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden}
.mode-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mode-pick .btn{flex-direction:column;gap:0;line-height:1.25}
.mode-pick small{font-weight:600;font-size:.78rem;opacity:.85}
.rec-steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px;font-size:1.05rem;line-height:1.55}
.rec-go{cursor:pointer;background:var(--warn);border-color:var(--warn);color:var(--surface)}
.rec-result{display:flex;flex-direction:column;gap:2px;border-radius:14px;padding:14px 16px}
.rec-result b{font-family:var(--f-display);font-weight:400;font-size:1.9rem}
.rec-result span{font-size:1.1rem;font-weight:700}
.rec-result.ok{background:var(--primary-soft);color:var(--primary)}
.rec-result.bad{background:var(--warn-soft);color:var(--warn)}
.pl-bar.big{height:18px;border-radius:9px}

/* 영상 인증: 시범과 내 모습을 반반 */
.half-tag{position:absolute;top:8px;left:8px;z-index:2;background:rgba(16,24,20,.78);color:#fff;font-weight:800;font-size:1rem;border-radius:999px;padding:3px 12px}
.fig-tag{display:none}
.pl-main.split{grid-template-columns:1fr}

.pl-main.split{gap:10px}

.pl-main.split .pl-count span{font-size:1.1rem}
.pl-main.split .pl-cue{font-size:1.45rem;min-height:0}
.pl-main.split .pl-fb{font-size:1rem;padding:6px 12px}
.pl-main.split .pl-hold{font-size:1.05rem}.pl-main.split .pl-hold b{font-size:1.8rem}
.pl-main.split .pl-try{font-size:.85rem}
.pl-main.split .pl-bar{height:8px}
.pl-main.split .pl-name{font-size:1.5rem}
.pl-main.split .pl-setup{font-size:1rem}
.pl-main.split .pl-dose{font-size:1.2rem;padding:8px 12px}
.pl-main.split .cam-tip{font-size:.95rem;padding:6px 10px}
.player:has(.pl-main.split) .pl-ctrl .btn{min-height:50px;font-size:1.05rem}
.player:has(.pl-main.split) .pl-opts .seg{min-height:40px;padding:4px 12px;font-size:.9rem}
.pl-stage.cam-on .fig-tag{display:block}
.pl-stage.cam-on .pl-fig{min-width:0}
.pl-stage.cam-on .pl-cam{position:relative;right:auto;bottom:auto;width:auto;height:auto;aspect-ratio:auto;min-height:100%;border:0;box-shadow:none;border-radius:var(--r);min-width:0}

<script>
(function(){
"use strict";
/* ================= 저장소 ================= */
const LS_KEY='barosegi.v1';
const blank=()=>({ver:1,updatedAt:0,safety:null,surveys:[],levelChoice:null,sessions:[],points:0,ledger:[],coupons:[],weight:null,profile:null,loc:null});
let state=blank();
let saveMode='local'; // local | account
let dbDoc=null, dbBlocked=false, saveTimer=null;
function lsGet(){try{const s=localStorage.getItem(LS_KEY);return s?JSON.parse(s):null}catch(e){return null}}
function lsSet(v){try{localStorage.setItem(LS_KEY,JSON.stringify(v))}catch(e){}}
const loaded=lsGet(); if(loaded&&loaded.ver===1) state=Object.assign(blank(),loaded);
function save(){
  state.updatedAt=Date.now(); lsSet(state); renderPts();
  if(dbDoc&&!dbBlocked){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{dbDoc.set(JSON.parse(JSON.stringify(state))).catch(e=>{if(e&&e.code==='invalid_argument'){dbBlocked=true;saveMode='local'}})},400)}
}
async function initDb(){
  try{
    if(!window.claude||!window.claude.use) return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    dbDoc=db.collection('data/users/'+id).doc('state');
    const snap=await dbDoc.get();
    const remote=snap.exists?snap.data():null;
    if(remote&&remote.ver===1&&(remote.updatedAt||0)>(state.updatedAt||0)){state=Object.assign(blank(),remote);lsSet(state);saveMode='account';route();}
    else if(state.updatedAt>0){await dbDoc.set(JSON.parse(JSON.stringify(state)));saveMode='account';}
    else saveMode='account';
    renderPts();
  }catch(e){ if(e&&e.code==='invalid_argument') dbBlocked=true; saveMode='local'; }
}

/* ================= 유틸 ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>{d=new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const today=()=>ymd(new Date());
function weekKey(d){const x=new Date(d||Date.now());x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return ymd(x)}
const fmtDate=s=>{const d=new Date(s);return (d.getMonth()+1)+'월 '+d.getDate()+'일'};
const LV_NAME={1:'초급',2:'중급',3:'상급'};
const reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= 인체 애니메이션 (COG·BOS 표시) ================= */
const FL=218, LEN={trunk:62,thigh:48.4,shin:48.4,upper:34,fore:34};
const BASE={
  side:{v:'side',f:1,hip:[110,110],tr:0,la:[108,206],ra:[112,206],lh:'hang',rh:'hang'},
  front:{v:'front',f:1,hip:[110,110],tr:0,la:[101,206],ra:[119,206],lh:'hang',rh:'hang'}
};
const S=o=>Object.assign({},BASE.side,o), F=o=>Object.assign({},BASE.front,o);
function ik(a,b,l1,l2,dir){
  const dx=b[0]-a[0],dy=b[1]-a[1];let d=Math.hypot(dx,dy)||0.001;const ang=Math.atan2(dy,dx);
  const dd=Math.min(d,l1+l2-0.01);const c=(l1*l1+dd*dd-l2*l2)/(2*l1*dd);const A=Math.acos(Math.max(-1,Math.min(1,c)));
  const t=ang+dir*A;const j=[a[0]+l1*Math.cos(t),a[1]+l1*Math.sin(t)];
  const ex=b[0]-j[0],ey=b[1]-j[1],el=Math.hypot(ex,ey)||1;const end=d>l1+l2?[j[0]+ex/el*l2,j[1]+ey/el*l2]:b;
  return {j,end};
}
function solve(p){
  const side=p.v==='side',f=p.f||1,rad=p.tr*Math.PI/180;
  const up=[Math.sin(rad)*(side?f:1),-Math.cos(rad)];
  const hip=p.hip, at=k=>[hip[0]+up[0]*k,hip[1]+up[1]*k];
  const neck=at(LEN.trunk), head=at(LEN.trunk+19), sh=at(54);
  const perp=[-up[1],up[0]];
  let lS=sh,rS=sh,lH=hip,rH=hip;
  if(!side){lS=[sh[0]-perp[0]*14,sh[1]-perp[1]*14];rS=[sh[0]+perp[0]*14,sh[1]+perp[1]*14];lH=[hip[0]-8,hip[1]];rH=[hip[0]+8,hip[1]]}
  const kl=ik(lH,p.la,LEN.thigh,LEN.shin,side?-f:1), kr=ik(rH,p.ra,LEN.thigh,LEN.shin,side?-f:-1);
  const la=kl.end, ra=kr.end;
  const foot=(an,toe,isL)=>{const heel=side?[an[0]-4*f,an[1]+12]:[an[0],an[1]+12];const t=toe||(side?[an[0]+14*f,an[1]+12]:[an[0]+(isL?-5:5),an[1]+12]);return{heel,toe:t}};
  const fl=foot(la,p.lt,true), fr=foot(ra,p.rt,false);
  const hand=(v,S0,isL,knee)=>{
    if(Array.isArray(v)) return v;
    if(v==='chest'){const c=at(40);return side?[c[0]+12*f,c[1]]:[c[0]+(isL?6:-6),c[1]+2]}
    if(v==='hips') return side?[hip[0]+4*f,hip[1]-6]:[(isL?lH:rH)[0]+(isL?-10:10),hip[1]-6];
    if(v==='up') return [S0[0]+(side?6*f:(isL?-8:8)),S0[1]-64];
    if(v==='reach') return [S0[0]+66*f,S0[1]+10];
    if(v==='knees') return [knee[0]+(side?-4*f:0),knee[1]-8];
    if(v==='swingF') return [S0[0]+22*f,S0[1]+58];
    if(v==='swingB') return [S0[0]-20*f,S0[1]+58];
    return side?[S0[0]-2*f,S0[1]+64]:[S0[0]+(isL?-7:7),S0[1]+64];
  };
  const lhT=hand(p.lh,lS,true,kl.j), rhT=hand(p.rh,rS,false,kr.j);
  const el=ik(lS,lhT,LEN.upper,LEN.fore,side?f:1), er=ik(rS,rhT,LEN.upper,LEN.fore,side?f:-1);
  const J={hip,neck,head,lS,rS,lH,rH,lK:kl.j,rK:kr.j,la,ra,lHeel:fl.heel,lToe:fl.toe,rHeel:fr.heel,rToe:fr.toe,lE:el.j,rE:er.j,lHand:el.end,rHand:er.end,waist:at(16),f,up};
  const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
  const parts=[[at(30),.56],[mid(lH,kl.j),.1],[mid(rH,kr.j),.1],[mid(kl.j,la),.06],[mid(kr.j,ra),.06],[mid(lS,J.lHand),.06],[mid(rS,J.rHand),.06]];
  let cx=0;parts.forEach(([pt,w])=>cx+=pt[0]*w);J.cog=[cx,at(30)[1]];
  const g=[J.lHeel,J.lToe,J.rHeel,J.rToe].filter(q=>q[1]>=FL-1.5).map(q=>q[0]);
  [[J.lHeel,J.lToe],[J.rHeel,J.rToe]].forEach(([hl,tq])=>{if(tq[1]>=FL-1.5&&hl[1]<FL-1.5)g.push(tq[0]-(side?8*f:0))});
  if(p.seat) g.push(p.seat[0],p.seat[1]);
  J.bos=g.length?[Math.min(...g),Math.max(...g)]:null;
  return J;
}
function lerpJ(a,b,t){const o={};for(const k in a){const x=a[k],y=b[k];if(Array.isArray(x)&&Array.isArray(y))o[k]=x.map((v,i)=>v+(y[i]-v)*t);else o[k]=t<.5?x:y}return o}
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function swapPose(p){const q=Object.assign({},p);q.la=p.ra;q.ra=p.la;q.lt=p.rt;q.rt=p.lt;q.lh=p.rh;q.rh=p.lh;return q}

function scoreSurvey(ans){
  const total=ans.reduce((a,b)=>a+b,0);

  const flags=[];
  const a=id=>ans[QUESTIONS.findIndex(q=>q.id===id)];
  if(a('falls')<=2){flags.push('지난 1년 동안 2번 이상 넘어졌거나 넘어져 다친 적이 있어 낙상 고위험군에 해당합니다(CDC STEADI 기준).')}
  if(a('oneleg')<=2){flags.push('한 발로 5초를 버티기 어렵습니다. 한발서기 5초 미만은 다치는 낙상 위험이 높다는 연구가 있습니다(Vellas 1997).')}
  if(a('chair')<=1){flags.push('의자에서 일어날 때 도움이 필요합니다. 운동할 때 가족이나 보호자가 곁에 있는 것이 안전합니다.')}
  if(flags.length&&lv>1){lv=1}
  const dom={};Object.keys(DOMS).forEach(k=>{const qs=QUESTIONS.map((q,i)=>q.dom===k?ans[i]:null).filter(v=>v!=null);dom[k]=Math.round(qs.reduce((x,y)=>x+y,0)/(qs.length*5)*100)});
  return{total,level:lv,raw:total>=40?3:total>=30?2:1,flags,dom};
}

let ttsObj=null,ttsTried=false;
async function speak(text){
  try{if(!ttsTried){ttsTried=true;if(window.claude&&window.claude.use){ttsObj=await window.claude.use('tts')}}}catch(e){ttsObj=null}
  if(ttsObj){
    try{await ttsObj.speak(text,{language:'ko'});return}
    catch(e){ if(!(e&&(e.code==='not_granted'||e.code==='unavailable'))) return; ttsObj=null; }
  }
  return new Promise(res=>{
    try{const ss=window.speechSynthesis;if(!ss){res();return}ss.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=.95;u.onend=res;u.onerror=res;ss.speak(u);setTimeout(res,Math.max(4000,text.length*230))}catch(e){res()}
  });
}

  }

      <span class="plabel">성별</span><div class="sexpick" role="group" aria-label="성별"><button type="button" class="seg" data-ssex="m" aria-pressed="${sv.sex==='m'}">남성</button><button type="button" class="seg" data-ssex="f" aria-pressed="${sv.sex==='f'}">여성</button></div>

     <button class="btn block" type="button" data-act="sv-prof">다음 (안전 확인)</button>

    ${SAFETY.map((t,i)=>`<div style="display:flex;flex-direction:column;gap:8px;padding-top:6px"><p><b>${i+1}.</b> ${t}</p><div class="row"><button type="button" class="seg" data-safe="${i}" data-v="1" aria-pressed="${sv.safety[i]===true}">예</button><button type="button" class="seg" data-safe="${i}" data-v="0" aria-pressed="${sv.safety[i]===false}">아니오</button></div></div>`).join('')}

function afterSurvey(){
  const v=$('#view');
  const host=$('#shortHost');if(host){mountShort(host,'risk');document.querySelectorAll('[data-short]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-short]').forEach(x=>x.setAttribute('aria-pressed',x===b));mountShort(host,b.dataset.short)}))}
  v.onclick=ev=>{
    const b=ev.target.closest('button');if(!b)return;
    if(b.dataset.act==='sv-start'){sv.step='profile';route()}
    else if(b.dataset.ssex){sv.sex=b.dataset.ssex;document.querySelectorAll('[data-ssex]').forEach(x=>x.setAttribute('aria-pressed',x===b))}
    else if(b.dataset.act==='sv-prof-skip'){sv.step='safety';route();window.scrollTo(0,0)}
    else if(b.dataset.act==='sv-prof'){
      const age=parseInt($('#sAge').value,10),h=parseFloat($('#sH').value),w=parseFloat($('#sW').value),err=$('#sErr');
      const bad=!(age>=40&&age<=110)?'나이를 40~110 사이로 입력해 주세요.':!(h>=120&&h<=210)?'키를 120~210cm 사이로 입력해 주세요.':!(w>=25&&w<=200)?'몸무게를 25~200kg 사이로 입력해 주세요.':null;
      if(bad){err.textContent=bad;err.hidden=false;return}
      state.profile={name:$('#sName').value.trim().slice(0,12),sex:sv.sex||null,age,height:Math.round(h*10)/10};state.weight=Math.round(w*10)/10;save();
      sv.step='safety';route();window.scrollTo(0,0)}
    else if(b.dataset.safe!=null){sv.safety[+b.dataset.safe]=b.dataset.v==='1';route()}
    else if(b.dataset.act==='sv-safety'){sv.step=sv.safety.some(Boolean)?'stop':'q';route()}
    else if(b.dataset.act==='sv-continue'){sv.step='q';route()}
    else if(b.dataset.ans){sv.ans[sv.q]=+b.dataset.ans;route();setTimeout(()=>{const n=document.querySelector('[data-act="sv-next"]');if(n)n.focus()},0)}
    else if(b.dataset.act==='sv-back'){if(sv.q===0)sv.step='safety';else sv.q--;route()}
    else if(b.dataset.act==='sv-next'){if(sv.q<9){sv.q++;route();window.scrollTo(0,0)}else finishSurvey()}
  };
}
function finishSurvey(){
  const r=scoreSurvey(sv.ans);const safetyFlag=sv.safety.some(Boolean);
  if(safetyFlag){r.flags.unshift('안전 확인에서 의료진 상담이 필요한 항목이 있었습니다.');r.level=1}
  const rec={date:new Date().toISOString(),answers:sv.ans.slice(),safety:sv.safety.slice(),total:r.total,level:r.level,raw:r.raw,flags:r.flags,dom:r.dom};
  const first=state.surveys.length===0;
  state.surveys.push(rec);state.levelChoice=null;state.safety=sv.safety.slice();
  if(first){state.points+=50;state.ledger.push({date:rec.date,delta:50,reason:'첫 설문 완료'})}
  save();sv=null;location.hash='result';
}

/* ---- 설문 결과: 나이대 기준과 비교 ---- */
function ageBand(age){return age<70?0:age<80?1:2}
const BAND_NAME=['60대','70대','80대 이상'];
const CHAIR5=[11.4,12.6,14.8];            /* Bohannon 2006: 5회 의자 일어서기 평균(초) 60대·70대·80대 */
const GAIT={m:[1.34,1.26,0.97],f:[1.24,1.13,0.94]}; /* Bohannon & Andrews 2011: 평소 보행속도(m/s) */
function ageCompare(r){
  const p=state.profile;
  if(!p||!p.age)return `<section class="card"><h3>내 나이대 기준과 비교</h3><p class="muted">나이를 입력하면 한발서기·의자 일어서기·걷기 속도를 또래 평균과 비교해 드려요.</p><button class="btn soft" type="button" data-prof="1">나이 입력하기</button></section>`;
  const b=ageBand(p.age),a=id=>r.answers[QUESTIONS.findIndex(q=>q.id===id)];
  const tone={good:['또래보다 좋아요','good'],same:['또래와 비슷해요','same'],low:['주의가 필요해요','low']};
  const rows=[];
  /* 한발서기 */
  {const v=a('oneleg'),rng=[[0,0],[0,5],[5,9],[10,29],[30,30]][v-1],norm=SLS_NORM[b][2];const mid=(rng[0]+rng[1])/2;
   const t=v===5||mid>=norm+3?'good':mid>=norm*.6?'same':'low';
   const pct=x=>Math.min(100,x/30*100);
   rows.push({k:'한발서기',me:['서지 못함','5초 미만','5~9초','10~29초','30초 이상'][v-1],norm:`${BAND_NAME[b]} 평균 ${norm}초`,t,src:'강의자료',
     bar:`<div class="cmp-bar" aria-hidden="true"><i class="me" style="left:${pct(rng[0])}%;width:${Math.max(3,pct(rng[1])-pct(rng[0]))}%"></i><i class="nm" style="left:${pct(norm)}%"></i><span style="left:0">0</span><span style="left:${pct(norm)}%">평균</span><span style="right:0">30초</span></div>`});}
  /* 의자 일어서기 */
  {const v=a('chair'),t=v>=5?'good':v===4?'same':'low';
   rows.push({k:'의자에서 일어서기',me:['도움 필요','팔로 짚어야 함','팔짱 끼고 1~2번','5번 가능하지만 힘듦','5번 쉽게'][v-1],norm:`${BAND_NAME[b]} 평균: 팔짱 끼고 5번 일어서는 데 ${CHAIR5[b]}초`,t,src:'Bohannon 2006'});}
  /* 걷기 속도 */
  {const v=a('gait'),g=(GAIT[p.sex]||[(1.34+1.24)/2,(1.26+1.13)/2,(0.97+0.94)/2])[b],t=v>=5?'good':v===4?(g<1?'good':'same'):'low';
   rows.push({k:'걷기 속도',me:['혼자 건너기 어려움','빠듯함','서두르면 건넘','보통 걸음으로 건넘','여유 있게 건넘'][v-1],norm:`${BAND_NAME[b]}${p.sex==='m'?' 남성':p.sex==='f'?' 여성':''} 평균 초속 ${g.toFixed(2)}m · 횡단보도 신호는 초속 1m 기준`,t,src:'Bohannon & Andrews 2011'});}
  /* 낙상 경험 */
  {const v=a('falls'),t=v>=4?'good':v===3?'same':'low';
   rows.push({k:'지난 1년 낙상',me:['3번 이상·병원 치료','2번','1번','넘어질 뻔함','없음'][v-1],norm:p.age>=80?'80세 이상은 해마다 2명 중 1명이 넘어져요':'65세 이상은 해마다 3명 중 1명이 넘어져요',t,src:'강의자료'});}
  /* 신체활동 */
  {const v=a('active'),t=v>=5?'good':v===4?'same':'low';
   rows.push({k:'운동·산책',me:['거의 안 함','한 달에 몇 번','주 1~2일','주 3~4일','주 5일 이상'][v-1],norm:'권장: 주 150분 이상(하루 30분 × 주 5일), 균형 운동은 주 3일 이상',t,src:'WHO 2020'});}
  const nGood=rows.filter(x=>x.t==='good').length,nLow=rows.filter(x=>x.t==='low').length;
  const head=nLow===0?`${p.name?esc(p.name)+' 님은 ':''}또래와 비교해 전반적으로 좋은 편이에요.`:nLow>=3?`${p.name?esc(p.name)+' 님은 ':''}또래보다 약한 부분이 많아요. 무리하지 말고 초급부터 차근차근 해요.`:`${p.name?esc(p.name)+' 님은 ':''}또래와 비슷하지만, 주의할 부분이 ${nLow}가지 있어요.`;
  return `<section class="card cmp"><span class="eyebrow">${BAND_NAME[b]}${p.sex==='m'?' 남성':p.sex==='f'?' 여성':''} 기준 (${p.age}세)</span><h3>내 나이대 기준과 비교</h3>
   <div class="cmp-sum"><span class="good">좋아요 ${nGood}</span><span class="same">비슷해요 ${rows.length-nGood-nLow}</span><span class="low">주의 ${nLow}</span></div>
   <p class="cmp-head">${head}</p>
   <ul class="cmp-list">${rows.map(x=>`<li class="${x.t}"><div class="cmp-top"><b>${x.k}</b><em>${tone[x.t][0]}</em></div><div class="cmp-me">내 답: <b>${x.me}</b></div>${x.bar||''}<div class="cmp-norm">${x.norm}</div><small>근거: ${x.src}</small></li>`).join('')}</ul>
   ${p.age<60?'<p class="small muted">60세 미만은 60대 기준으로 비교했어요.</p>':''}
   <p class="small muted">설문 답(보기)을 기준으로 한 대략적인 비교예요. 정확한 측정은 보건소나 운동 전문가에게 받아 보세요.</p></section>`;
}
function viewResult(){
  const r=lastSurvey();if(!r) return `<section class="card"><h2>아직 설문 결과가 없어요</h2><a class="btn" href="#survey">설문 하러 가기</a></section>`;

/* ---- 영상 인증 (영상은 기기 안에서만 분석, 저장·전송 없음) ---- */
const MP='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MP_MODEL='https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';
function camVisible(L){return !!L&&[0,11,12,23,24,25,26].every(i=>L[i]&&L[i].visibility>.5)&&(L[27].visibility>.35||L[28].visibility>.35)}
const CAM={on:false,stream:null,lm:null,last:null,fresh:false,t:0,ts:0,ar:.75,raf:0,loading:null,
  async start(video,canvas,chip){
    this.video=video;this.canvas=canvas;this.chip=chip;
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw {code:'unsupported'};
    this.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
    video.srcObject=this.stream;try{await video.play()}catch(e){}
    this.on=true;this.loop();
    if(!this.lm){this.setChip('동작 인식 준비 중…');try{await this.ensurePose()}catch(e){this.setChip('동작 인식을 불러오지 못했어요');throw {code:'model'}}}
  },
  async ensurePose(){if(this.lm)return;if(!this.loading)this.loading=this.loadPose().catch(e=>{this.loading=null;throw e});await this.loading},
  async loadPose(){
    const mod=await import(MP+'/vision_bundle.mjs');
    const mk=(fs,model,d)=>mod.PoseLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:model,delegate:d},runningMode:'VIDEO',numPoses:1});
    const loc=n=>new URL(n,location.href).href;
    /* 페이지와 함께 올린 파일을 먼저 쓰고(claude.ai 안에서도 작동), 없으면 인터넷(CDN)에서 받음 */
    const srcs=[];
    try{const r=await fetch(loc('mp/pose_model.txt'));if(r.ok){const b64=(await r.text()).trim();const bin=atob(b64);const buf=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);
      srcs.push({fs:{wasmLoaderPath:MP+'/wasm/vision_wasm_internal.js',wasmBinaryPath:loc('mp/vision_wasm_internal.wasm')},buf})}}catch(e){}
    try{srcs.push({fs:await mod.FilesetResolver.forVisionTasks(MP+'/wasm'),model:MP_MODEL})}catch(e){}
    const mk2=(s,d)=>mod.PoseLandmarker.createFromOptions(s.fs,{baseOptions:s.buf?{modelAssetBuffer:s.buf,delegate:d}:{modelAssetPath:s.model,delegate:d},runningMode:'VIDEO',numPoses:1});
    let last;for(const s of srcs)for(const d of ['GPU','CPU']){try{this.lm=await mk2(s,d);return}catch(e){last=e}}
    throw last;
  },
  setChip(t,ok){if(this.chip&&this.chip.textContent!==t){this.chip.textContent=t}if(this.chip)this.chip.classList.toggle('ok',!!ok)},
  loop(){
    let lt=0;const tick=now=>{if(!this.on)return;const v=this.video;
      if(this.lm&&v&&v.readyState>=2&&now-lt>66){lt=now;
        try{this.ts=Math.max(now,this.ts+1);const r=this.lm.detectForVideo(v,this.ts);this.last=(r.landmarks&&r.landmarks[0])||null;this.fresh=true;this.t=now;this.ar=(v.videoHeight/v.videoWidth)||.75;this.drawSk();
          if(!this.hint){const vis=camVisible(this.last);this.setChip(!this.last?'사람이 보이지 않아요':vis?'잘 보여요':'머리부터 발까지 보이게 뒤로 물러나 주세요',vis)}}catch(e){}}
      this.raf=requestAnimationFrame(tick)};
    this.raf=requestAnimationFrame(tick);
  },
  drawSk(){
    const c=this.canvas,v=this.video;if(!c||!v)return;const w=c.width=v.videoWidth||640,h=c.height=v.videoHeight||480;const g=c.getContext('2d');g.clearRect(0,0,w,h);const L=this.last;if(!L)return;
    g.lineWidth=Math.max(3,w/110);g.strokeStyle=this.bad?'#FF7A6B':'#5CE1B0';g.fillStyle='#FFD25A';g.lineCap='round';
    [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28],[27,29],[29,31],[27,31],[28,30],[30,32],[28,32]].forEach(([a,b])=>{if(L[a].visibility>.4&&L[b].visibility>.4){g.beginPath();g.moveTo(L[a].x*w,L[a].y*h);g.lineTo(L[b].x*w,L[b].y*h);g.stroke()}});
    [0,11,12,13,14,15,16,23,24,25,26,27,28].forEach(i=>{if(L[i].visibility>.4){g.beginPath();g.arc(L[i].x*w,L[i].y*h,g.lineWidth*1.3,0,7);g.fill()}});
  },
  stop(){this.on=false;cancelAnimationFrame(this.raf);if(this.stream){this.stream.getTracks().forEach(t=>t.stop());this.stream=null}this.last=null;if(this.video)this.video.srcObject=null}
};

async function analyzeVideo(file,id,lv,dose,onProg){
  await CAM.ensurePose();
  const url=URL.createObjectURL(file);const v=document.createElement('video');v.muted=true;v.playsInline=true;v.setAttribute('playsinline','');v.preload='auto';v.src=url;
  try{
    await new Promise((res,rej)=>{v.onloadedmetadata=res;v.onerror=()=>rej({code:'video'});setTimeout(()=>rej({code:'video'}),20000)});
    try{await v.play();v.pause()}catch(e){}
    const dur=v.duration;if(!isFinite(dur)||dur<1.5)throw{code:'short'};
    const prevAr=CAM.ar;CAM.ar=(v.videoHeight/v.videoWidth)||.75;
    const sg=VCHK[id],chk=new VCheck(id,lv),per=lvv(sg.per||1,lv),step=.1;
    let ok=0,sub=0,tries=0,vis=0,n=0,hold=0;const why={};
    const seek=t=>new Promise(res=>{let done=false;const fin=()=>{if(done)return;done=true;v.removeEventListener('seeked',fin);res()};v.addEventListener('seeked',fin);v.currentTime=t;setTimeout(fin,2500)});
    for(let t=0;t<dur;t+=step){
      await seek(Math.min(t,dur-.05));
      CAM.ts+=100;let L=null;try{const r=CAM.lm.detectForVideo(v,CAM.ts);L=(r.landmarks&&r.landmarks[0])||null}catch(e){}
      n++;if(camVisible(L))vis++;
      if(t<.8){chk.calib(L);continue}
      const r=chk.push(L,t*1000);
      if(r.hold!=null)hold=r.hold;
      if(r.rep){tries++;if(r.ok){sub++;if(sub>=per){sub=0;ok++}}else why[r.fb]=(why[r.fb]||0)+1}
      else if(r.fb&&r.bad)why[r.fb]=(why[r.fb]||0)+.05;
      if(onProg&&n%3===0)onProg(Math.min(1,t/dur));
    }
    CAM.ar=prevAr;
    const need=sg.still?dose.hold:dose.reps*(dose.side?2:1),got=sg.still?Math.floor(hold/1000):ok;
    return{pass:got>=need&&vis/Math.max(1,n)>.5,got,need,tries,still:!!sg.still,visRate:vis/Math.max(1,n),top:Object.entries(why).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0])};
  }finally{URL.revokeObjectURL(url)}
}

  }
  split(on){const st=document.querySelector('.pl-stage'),mn=document.querySelector('.pl-main');if(st)st.classList.toggle('cam-on',on);if(mn)mn.classList.toggle('split',on);if(this.isSplit!==on){this.isSplit=on;if(this.fig){const keep=this.t;this.buildFig(this.side===1,this.phase!=='work');if(this.phase==='work'){this.t=0;this.key=null}}}}
  modeBtns(){const r=document.querySelector('.pl-opts [data-p="recmode"]'),c=document.querySelector('.pl-opts [data-p="cam"]');if(r)r.setAttribute('aria-pressed',this.mode==='rec');if(c){c.setAttribute('aria-pressed',this.mode==='live'&&CAM.on);c.textContent=this.mode==='live'&&CAM.on?'영상 인증 끄기':'영상 인증 켜기'}}

    if(this.phase==='intro'||this.phase==='recintro'||this.phase==='recdone'){this.panelPhase='';this.enterIntro(this.idx===0)}
  }
  enterRecIntro(first){
    this.phase='recintro';this.panelPhase='';this.set=1;this.side=0;this.rep=0;this.dots();
    this.buildFig(false,false);this.over.hidden=true;

    const goal=vc.still?`바른 자세로 ${d.hold}초 버티기${d.side?' (왼쪽→오른쪽 이어서)':''}`:`정확한 동작 ${d.reps}${this.id==='S4'?'걸음':'회'}${d.side?' × 왼쪽·오른쪽':''}`;
    this.setPanel(`<span class="eyebrow">${first?'첫 동작':'다음 동작'} · ${this.idx+1} / ${this.list.length} · 촬영 인증</span><span class="chip ${st}" style="align-self:flex-start">${label}</span>

  }
  async onRecFile(file){
    if(this.mode!=='rec')this.setMode('rec');
    stopVoice();this.phase='analyzing';this.panelPhase='';const E=this.E,d=this.dose,id=this.id,lv=this.lv;
    this.setPanel(`<span class="eyebrow">영상 분석 중</span><h2 class="pl-name">${E.name}</h2><div class="pl-setup">정확한 동작을 하나씩 확인하고 있어요. 잠시만 기다려 주세요.</div><div class="pl-bar big"><i id="anBar"></i></div><div class="pl-try" id="anTxt">동작 분석 프로그램 준비 중…</div>`);
    try{
      const res=await analyzeVideo(file,id,lv,d,k=>{const b=$('#anBar'),t=$('#anTxt');if(b)b.style.width=(k*100)+'%';if(t)t.textContent=`분석 ${Math.round(k*100)}%`});
      if(!this.alive||this.id!==id)return;
      const vr=this.vr[this.idx];vr.tries=res.tries;vr.ok=res.got;

      if(res.pass){vr.recOk=true;vr.done=true;this.dots();beep(880,160);this.qsay('인증 완료! 정확하게 잘하셨어요.');
        this.setPanel(`<span class="eyebrow">촬영 인증</span><div class="rec-result ok"><b>인증 완료</b><span>${res.still?'바른 자세 유지':'정확한 동작'} ${res.got} / ${res.need}${unit}</span></div><h2 class="pl-name">${E.name}</h2>
          <button class="btn block pl-go" type="button" data-p="recnext">다음 동작으로</button>${d.sets>1?`<button class="btn ghost block" type="button" data-p="recsets">남은 세트도 시범 따라 하기</button>`:''}`);
      }else{beep(220,200);
        const reasons=res.visRate<=.5?['머리부터 발끝까지 화면에 보이게 찍어 주세요']:res.top.length?res.top:[res.tries?'시범과 똑같이, 조금 더 크고 천천히 해 주세요':'동작이 잘 보이지 않았어요. 카메라 방향을 확인해 주세요'];
        this.qsay('아직 인증되지 않았어요. '+reasons[0]);
        this.setPanel(`<span class="eyebrow">촬영 인증</span><div class="rec-result bad"><b>아직 인증되지 않았어요</b><span>${res.still?'바른 자세 유지':'정확한 동작'} ${res.got} / ${res.need}${unit}${res.still?'':` · 시도 ${res.tries}회`}</span></div>
          <div class="pl-fb bad">${reasons.map(esc).join('<br>')}</div>
          <label for="recIn" class="btn block pl-go rec-go" role="button">● 다시 촬영하기</label>
          <button class="btn ghost block" type="button" data-p="recnext">이 동작 건너뛰기 (인증 안 됨)</button>`);
      }
    }catch(e){
      if(!this.alive)return;this.phase='recdone';
      const msg=e&&e.code==='short'?'영상이 너무 짧아요. 동작을 끝까지 찍어 주세요.':e&&e.code==='video'?'영상을 열 수 없었어요. 다시 촬영해 주세요.':'이 화면에서 동작 분석 프로그램을 불러오지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.';
      this.setPanel(`<div class="pl-fb bad">${msg}</div><label for="recIn" class="btn block pl-go rec-go" role="button">● 다시 촬영하기</label><button class="btn ghost block" type="button" data-p="recnext">이 동작 건너뛰기 (인증 안 됨)</button>`);
    }
  }
  proof(){
    const miss=this.list.filter((id,k)=>!(this.vr[k]&&this.vr[k].done)).map(id=>EX[id].name);
    const okN=this.list.length-miss.length;
    return{type:miss.length===0?'video':'none',score:okN/this.list.length,miss};
  }
  proofLine(){
    const el=$('#proofLine');if(!el)return;const okN=this.vr.filter(r=>r&&r.done).length;
    el.innerHTML=this.camMsg?`<span class="warn-txt">${this.camMsg}</span>`:this.mode==='rec'?`촬영 인증 중 · 동작마다 영상을 찍으면 정확한 동작만 셉니다. 영상은 이 기기 안에서만 분석하고 저장하지 않아요.`:this.vmode()?`영상 인증 중 · 정확한 동작만 셉니다. 영상은 이 기기 안에서만 분석하고 저장하지 않아요.`:CAM.on?'동작 인식을 준비하고 있어요…':'영상 인증을 켜고 8개 동작을 모두 정확하게 마치면 100P를 받아요. 인증하지 않으면 포인트 없이 기록만 남아요.';
  }
  async toggleCam(){
    const btn=document.querySelector('.pl-opts [data-p="cam"]'),box=$('#plCam');
    if(CAM.on){CAM.stop();box.hidden=true;this.split(false);this.mode=null;this.modeBtns();this.camMsg='영상 인증을 껐어요. 인증하지 않은 동작은 포인트에 포함되지 않아요.';this.proofLine();return}
    box.hidden=false;this.split(true);btn.setAttribute('aria-pressed','true');btn.textContent='영상 인증 끄기';this.camMsg='';this.proofLine();
    const t0=performance.now();
    try{await CAM.start($('#camV'),$('#camC'),$('#camChip'));if(!this.alive){CAM.stop();return}this.proofLine();this.modeBtns();if(this.phase==='intro')this.enterIntro(this.idx===0);else if(this.panelPhase==='work'){this.panelPhase='';this.renderWorkPanel()}}
    catch(e){
      if(e&&e.code==='model'){this.camMsg='동작 인식 프로그램을 불러오지 못해 영상 인증을 할 수 없어요. 인터넷 연결을 확인해 주세요.'}
      else{CAM.stop();box.hidden=true;this.split(false);this.mode=null;this.modeBtns();
        const kind=camBlockKind(e,performance.now()-t0);
        this.camMsg=kind==='host'?'지금 보고 계신 화면(claude.ai 미리보기)은 보안 정책 때문에 실시간 카메라를 쓸 수 없어요. <button class="linkbtn" type="button" data-p="camhelp">해결 방법 보기</button>':kind==='denied'?'카메라 권한이 꺼져 있어요. <button class="linkbtn" type="button" data-p="camhelp">권한 켜는 방법 보기</button>':kind==='insecure'?'카메라는 https 주소에서만 켜져요. <button class="linkbtn" type="button" data-p="camhelp">해결 방법 보기</button>':'카메라를 찾지 못했어요. 다른 앱이 카메라를 쓰고 있지 않은지 확인해 주세요. <button class="linkbtn" type="button" data-p="camhelp">도움말</button>';
        this.camKind=kind;showCamHelp(kind)}

    }
  }
  destroy(){CAM.stop();CAM.hint=false;this.alive=false;cancelAnimationFrame(this.raf);if(this.fig)this.fig.destroy();stopVoice();document.removeEventListener('visibilitychange',this.onVis);try{this.lock&&this.lock.release()}catch(e){}}
}

/* 운동 시간·칼로리·힘든 정도 */
const MET={1:2.5,2:3.0,3:3.5};
function kcalOf(lv,sec,kg){return Math.round(MET[lv]*3.5*kg/200*(sec/60))}
function fmtDur(sec){const m=Math.floor(sec/60),s=sec%60;return m?`${m}분 ${s}초`:`${s}초`}
const RPE_TXT={1:'아주 쉬웠어요',2:'쉬웠어요',3:'적당했어요',4:'힘들었어요',5:'아주 힘들었어요'};
function rpeAdvice(n,lv){
  if(n<=2)return lv<3?'충분히 할 만하셨네요! 다음 주에도 쉬우면 한 단계 올려 보세요.':'아주 좋아요! 지금 단계를 꾸준히 이어 가세요.';
  if(n===3)return '딱 알맞은 강도예요. 이대로 꾸준히 해요.';
  if(n===4)return '수고하셨어요. 다음 운동까지 하루는 꼭 쉬어 주세요.';
  return lv>1?'많이 힘드셨군요. 다음에는 "천천히"를 켜거나 한 단계 낮춰 보세요.':'많이 힘드셨군요. 동작 크기를 줄이고 천천히 해 보세요. 통증이 있으면 쉬세요.';
}
function completeSession(day,started,proof,score,miss){
  proof=proof||'none';const base=proof==='video'?100:0;
  const lv=curLevel()||1;const wk=weekKey(),td=today();
  const rewardedToday=state.sessions.some(s=>s.date===td&&s.points>0);
  const pts=(rewardedToday||!base)?0:base;
  const sec=Math.max(1,Math.round((Date.now()-(started||Date.now()))/1000));
  state.sessions.push({date:td,week:wk,day,level:lv,points:pts,proof,score:Math.round((score||0)*100),min:Math.max(1,Math.round(sec/60)),sec,kcal:kcalOf(lv,sec,state.weight||60),rpe:null});
  const sIdx=state.sessions.length-1;
  let bonus=0;
  if(pts>0){state.points+=pts;state.ledger.push({date:new Date().toISOString(),delta:pts,reason:DAYS[day].name+' 운동 (영상 인증)'})}
  const d=weekDone(wk);
  if(['ankle','hip','step'].every(k=>d.has(k))&&!state.ledger.some(l=>l.bonusWeek===wk)){bonus=300;state.points+=bonus;state.ledger.push({date:new Date().toISOString(),delta:bonus,reason:'주 3회(발목·고관절·디딤) 달성 보너스',bonusWeek:wk})}
  save();
  const missTxt=miss&&miss.length?`<div class="notice small"><b>인증되지 않은 동작</b><br>${miss.map(esc).join(', ')}<br>영상 인증을 켠 채 정확한 동작으로 끝까지 마쳐야 인증돼요.</div>`:'';
  const ss=state.sessions[sIdx];
  openModal(`<div class="burst">${pts+bonus>0?'+'+(pts+bonus)+'P':'완료!'}</div><h2>${DAYS[day].name} 운동을 마쳤어요</h2>
   <div class="done-stats"><div><span>총 운동 시간</span><b>${fmtDur(sec)}</b></div><div><span>소모 칼로리</span><b id="kcalV">${ss.kcal}<small>kcal</small></b></div></div>
   <p class="small muted kcal-note">체중 <b id="wV">${state.weight||60}</b>kg 기준 · ${LV_NAME[lv]} 강도(MET ${MET[lv]})로 계산한 추정값이에요. <button class="linkbtn" type="button" data-wedit="1">체중 바꾸기</button>${hasProfile()?'':' · 내 기록에서 키·나이도 입력할 수 있어요.'}</p>
   <div class="wbox" id="wBox" hidden><label for="wIn">내 체중(kg)</label><input id="wIn" type="number" inputmode="decimal" min="25" max="200" step="0.5" value="${state.weight||60}"><button class="btn soft pl-mini" type="button" data-wsave="${sIdx}">적용</button></div>
   <div class="rpe" data-sidx="${sIdx}"><h3>오늘 운동, 얼마나 힘들었나요?</h3><div class="stars" role="radiogroup" aria-label="힘든 정도 별 5개">${[1,2,3,4,5].map(n=>`<button type="button" class="star" role="radio" aria-checked="false" aria-label="${RPE_TXT[n]}" data-star="${n}">★</button>`).join('')}</div><p class="rpe-txt" id="rpeTxt">별을 눌러 알려 주세요</p></div>
   <p>${proof==='none'?'영상 인증이 완료되지 않아 이번 운동은 포인트 없이 기록만 남았어요.':pts>0?'8개 동작을 모두 정확하게 마쳐 영상 인증이 완료됐어요. 100P가 쌓였어요.':'영상 인증 완료! 오늘은 이미 포인트를 받았어요. 포인트는 하루에 한 번 드립니다.'}</p>
   ${missTxt}
   ${bonus?'<div class="notice info"><b>이번 주 3회 달성!</b> 보너스 300P를 드려요.</div>':`<p class="muted small">이번 주 ${weekDone(wk).size} / 3회 완료</p>`}
   <div class="row"><a class="btn" href="#home" data-close>처음으로</a><a class="btn ghost" href="#store" data-close>스토어 가기</a></div>`);
}

const SLS_NORM=[[60,69,27.0],[70,79,17.2],[80,120,8.5]]; /* 강의자료: 연령대별 한발서기 평균(초) */
function bmiOf(h,w){return h&&w?w/Math.pow(h/100,2):null}
function bmiCat(b){return b<18.5?['저체중','warn']:b<23?['정상','ok']:b<25?['비만 전단계','gold']:b<30?['1단계 비만','warn']:['2단계 이상 비만','warn']} /* 대한비만학회 기준 */
function hasProfile(){const p=state.profile;return !!(p&&p.age&&p.height&&state.weight)}
function profileCard(){
  const p=state.profile||{},w=state.weight;
  if(!hasProfile())return `<section class="card prof empty"><div class="prof-head"><div><span class="eyebrow">내 정보</span><h2>키·몸무게·나이를 알려 주세요</h2></div></div><p class="muted">입력하면 칼로리를 내 몸무게로 계산하고, 내 나이대 균형 기준도 보여 드려요. 정보는 이 기록 안에만 저장돼요.</p><button class="btn" type="button" data-prof="1">내 정보 입력하기</button></section>`;
  const b=bmiOf(p.height,w),[cat,tone]=bmiCat(b),norm=SLS_NORM.find(r=>p.age>=r[0]&&p.age<=r[1]);
  return `<section class="card prof"><div class="prof-head"><div><span class="eyebrow">내 정보</span><h2>${p.name?esc(p.name)+' 님':'내 신체 정보'}</h2></div><button class="btn ghost pl-mini" type="button" data-prof="1">수정</button></div>
   <div class="prof-grid"><div><span>성별</span><b>${p.sex==='m'?'남성':p.sex==='f'?'여성':'-'}</b></div><div><span>나이</span><b>${p.age}<small>세</small></b></div><div><span>키</span><b>${p.height}<small>cm</small></b></div><div><span>몸무게</span><b>${w}<small>kg</small></b></div></div>
   <div class="prof-bmi ${tone}"><span>체질량지수(BMI)</span><b>${b.toFixed(1)}</b><em>${cat}</em></div>
   ${norm?`<p class="small">내 나이대(${norm[0]}대${norm[0]>=80?' 이상':''}) <b>한발서기 평균은 ${norm[2]}초</b>예요. 설문에서 내 기록과 비교해 보세요.</p>`:''}
   <p class="small muted">BMI 기준: 대한비만학회(18.5 미만 저체중 · 23 미만 정상 · 25 미만 비만 전단계 · 25 이상 비만). 한발서기 평균: 강의자료.</p></section>`;
}

  openModal(`<h2>내 정보</h2><p class="small muted">칼로리 계산과 내 나이대 기준을 보여 주는 데 쓰여요.</p>

  <section class="card"><h3>설문 결과</h3>${state.surveys.length?`<ul class="ledger">${state.surveys.slice().reverse().map(s=>`<li><span>${fmtDate(s.date)}</span><span>${s.total}점 · ${LV_NAME[s.level]}</span></li>`).join('')}</ul><a class="btn ghost" href="#result">최근 결과 자세히 보기</a>`:'<p class="muted">아직 설문 결과가 없어요. <a href="#survey">설문하기</a></p>'}</section>
  <section class="card"><h3>포인트 내역</h3>${state.ledger.length?`<ul class="ledger">${state.ledger.slice(-15).reverse().map(l=>`<li><span>${fmtDate(l.date)} · ${esc(l.reason)}</span><span class="${l.delta>0?'plus':'minus'}">${l.delta>0?'+':''}${l.delta.toLocaleString('ko-KR')}P</span></li>`).join('')}</ul>`:'<p class="muted">운동을 마치면 포인트가 쌓여요.</p>'}</section>
  <section class="card"><h3>기록 초기화</h3><p class="small muted">설문, 운동, 포인트, 교환권 기록을 모두 지웁니다. 되돌릴 수 없어요.</p><button class="btn warn" type="button" id="resetBtn">모든 기록 지우기</button></section>`;
}
function afterMy(){
  $('#resetBtn').onclick=()=>{openModal(`<h2>모든 기록을 지울까요?</h2><p>설문, 운동, 포인트, 교환권이 모두 사라지며 되돌릴 수 없어요.</p><div class="row"><button class="btn warn" type="button" id="doReset">지우기</button><button class="btn ghost" type="button" data-close>취소</button></div>`);
    $('#doReset').onclick=()=>{state=blank();save();closeModal();route()}};
}

/* ================= 모달·라우터 ================= */
function openModal(html){const m=$('#modal');m.innerHTML=`<div class="modal-box" role="dialog" aria-modal="true">${html}</div>`;m.hidden=false;const f=m.querySelector('button,a');if(f)f.focus()}
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML=''}
$('#modal').addEventListener('click',e=>{if(e.target.closest('[data-userec]')){closeModal();if(PL)PL.setMode('rec');return}
  const cy=e.target.closest('[data-city]');if(cy){const c=CITIES[+cy.dataset.city];state.loc={name:c[0],lat:c[1],lon:c[2]};save();closeModal();loadWx(true);return}
  if(e.target.closest('[data-wxgeo]')){const b=e.target.closest('[data-wxgeo]');b.textContent='위치를 확인하는 중…';
    if(!navigator.geolocation){b.textContent='이 기기에서는 위치를 쓸 수 없어요';return}
    navigator.geolocation.getCurrentPosition(pos=>{state.loc={name:'내 위치',lat:+pos.coords.latitude.toFixed(3),lon:+pos.coords.longitude.toFixed(3)};save();closeModal();loadWx(true)},
      ()=>{b.textContent='위치를 쓸 수 없어요. 아래에서 지역을 골라 주세요.'},{timeout:10000,maximumAge:600000});return}
  const st=e.target.closest('[data-star]');if(st){const n=+st.dataset.star,box=st.closest('.rpe'),i=+box.dataset.sidx;if(state.sessions[i]){state.sessions[i].rpe=n;save()}
    box.querySelectorAll('.star').forEach(b=>{const on=+b.dataset.star<=n;b.classList.toggle('on',on);b.setAttribute('aria-checked',+b.dataset.star===n)});
    const lv=state.sessions[i]?state.sessions[i].level:1;$('#rpeTxt').innerHTML=`<b>${RPE_TXT[n]}</b><br>${rpeAdvice(n,lv)}`;return}
  if(e.target.closest('[data-wedit]')){const w=$('#wBox');w.hidden=!w.hidden;if(!w.hidden)$('#wIn').focus();return}
  const ws=e.target.closest('[data-wsave]');if(ws){const kg=parseFloat($('#wIn').value);if(!(kg>=25&&kg<=200)){$('#wIn').focus();return}
    state.weight=Math.round(kg*2)/2;const i=+ws.dataset.wsave,ss=state.sessions[i];if(ss){ss.kcal=kcalOf(ss.level,ss.sec||ss.min*60,state.weight)}save();
    $('#kcalV').innerHTML=`${ss?ss.kcal:0}<small>kcal</small>`;$('#wV').textContent=state.weight;$('#wBox').hidden=true;return}const c=e.target.closest('[data-close]');if(e.target.id==='modal'||c){e.preventDefault();const href=c&&c.getAttribute('href');closeModal();if(href&&href.startsWith('#'))location.hash=href.slice(1)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
$('#view').addEventListener('click',e=>{if(e.target.closest('[data-prof]'))openProfile();else if(e.target.closest('[data-wxloc]'))openLocPicker();else if(e.target.closest('[data-wxretry]'))loadWx(true)});

function route(){
  killFigs();if(shortCtl){shortCtl.stop();shortCtl=null}clearInterval(tmrId);if(PL){PL.destroy();PL=null}
  const v=$('#view');v.onclick=null;
  let h=(location.hash||'#home').slice(1);let day=null;
  if(h.startsWith('session-')){day=h.slice(8);h='session'}
  if(h!=='survey') sv=null;
  const map={home:viewHome,survey:viewSurvey,result:viewResult,program:viewProgram,store:viewStore,my:viewMy,evidence:viewEvidence};
  if(h==='session') v.innerHTML=viewSession(day); else v.innerHTML=(map[h]||viewHome)();
  renderTabs(h);renderPts();document.body.classList.toggle('focus',h==='session');
  const after={home:afterHome,survey:afterSurvey,program:afterProgram,store:afterStore,my:afterMy};
  if(h==='session'&&DAYS[day]) afterSession(day); else if(after[h]) after[h]();
}
let lastHash=location.hash;
window.addEventListener('hashchange',()=>{const a=lastHash.split('-')[0],b=location.hash.split('-')[0];lastHash=location.hash;route();if(a!==b)window.scrollTo(0,0)});
route();
initDb();
})();
</script>
